<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="Underwater view of a swimmer pushing off the pool wall in streamline with a dolphin kick" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Push-off</title>
  <desc>A swimmer seen from the side underwater, arms locked in streamline, body arced in a dolphin kick, travelling right away from the tiled pool wall. Light shafts fall from the surface and bubbles trail from the feet.</desc>
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa8cc"/>
      <stop offset="0.45" stop-color="#1a6d92"/>
      <stop offset="1" stop-color="#07304a"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdf3ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#cdf3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fe0f5" stop-opacity="0.1"/>
      <stop offset="0.6" stop-color="#8fe0f5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8fe0f5" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="pool"><rect x="0" y="0" width="900" height="500"/></clipPath>
  </defs>

  <g clip-path="url(#pool)">
