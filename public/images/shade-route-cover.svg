      <stop offset="1" stop-color="#f8cd58" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shadeFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3546" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2a3546" stop-opacity="0.13"/>
    </linearGradient>
  </defs>

