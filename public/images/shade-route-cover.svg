<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="City map showing a direct sunlit route and a longer route that stays in building shade" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Shade routing cover</title>
  <desc>Top-down city map with a grid of streets and buildings. The low sun in the upper left throws long shadows across the streets. A dashed amber line marks the direct, sun-exposed route between two points; a solid blue line marks a slightly longer route that follows the shaded side of the blocks.</desc>

